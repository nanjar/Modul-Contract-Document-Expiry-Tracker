name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://expiry_tracker:expiry_tracker@localhost:5432/expiry_tracker?schema=public
      JWT_SECRET: ci-only-test-secret
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      NOTIFICATION_EMAIL_MODE: console
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm test -- --runInBand
      - run: pnpm build

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_NOTIFICATION_EMAIL_MODE: console
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
