name: Repair dashboard JSX

on:
  push:
    branches: [main]

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: repair dashboard JSX syntax') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair JSX syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/app/page.tsx')
          text = path.read_text()
          old = '</Link>); }) : <div className="empty-attention">'
          new = '</Link> }) : <div className="empty-attention">'
          if old not in text:
              raise SystemExit('Expected broken JSX sequence was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair dashboard JSX syntax"
          git push
