services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: expiry_tracker
      POSTGRES_USER: expiry_tracker
      POSTGRES_PASSWORD: expiry_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expiry_tracker -d expiry_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
